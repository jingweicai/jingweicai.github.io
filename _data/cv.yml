- title: Professional Experience
  type: time_table
  contents:
    - title: Topseed, Heterogeneous Computing
      institution: ByteDance SEED
      year: Current
      description:
        - "<strong>Workload monitoring and modeling:</strong> Co-responsible for cloud workload monitoring and modeling to support inference optimization and performance evaluation. Built modeling dimensions around scenarios, sequence characteristics, inference frameworks, and workload imbalance."
        - "<strong>3D chip co-design:</strong> Led co-design discussions with leading domestic 3D DRAM chip vendors, defining architecture requirements from ByteDance production workloads and driving chip design optimizations that improved ByteDance-scenario performance by 1.5-2x."
        - "<strong>XSIM-ROOFLINE:</strong> Built early-stage architecture simulation infrastructure for chip evaluation and co-design. Integrated four domestic chips, controlled simulation error within 10% on one chip, and enabled 1.5-2x performance improvement."
    - title: Compiler Team Technical Lead and Chip Architect
      institution: Arctic Xiongxin Information Technology Co., Ltd.
      year: 2020.06 - Present
      description:
        - "<strong>Chip architecture:</strong> Led the design of multi-core NPU interconnects, compute-core microarchitecture, and ISA support across four Qiming chip generations, including QM-930, QM-935, QM-940, and QM-940-3D."
        - "<strong>Hardware-software co-design:</strong> Translated scheduling strategies from ISCA 2023, HPCA 2024, DAC 2025, and HPCA 2025 work into architecture specifications and microarchitecture support."
        - "<strong>Compiler leadership:</strong> Spearheaded two generations of scalable compiler software stacks for 12nm large-scale DNN accelerators, covering frontend IR parsing, graph optimization, prefetching, on-chip memory allocation, IR generation, instruction generation, and instruction-level simulation."
        - "<strong>Deployment:</strong> The compiler stack supports more than 90% of ONNX operators and achieves high compute utilization on mainstream autonomous-driving neural networks."

